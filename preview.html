
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Preview | Hair Bestie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #25152E, #492B49);
            color: #FFF0C9;
            min-height: 100vh;
        }

        header {
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #D9AE55;
        }

        header h1 {
            color: #D9AE55;
            margin: 0;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        h2 {
            color: #D9AE55;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .preview-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid #D9AE55;
            border-radius: 18px;
            padding: 18px;
        }

        .preview-card img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #1B1020;
            border-radius: 12px;
        }

        .preview-card h3 {
            color: #D9AE55;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back {
            background: transparent;
            border: 1px solid #D9AE55;
            color: #FFF0C9;
        }

        .continue {
            background: #D9AE55;
            color: #25152E;
        }

        @media (max-width: 650px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/atelier-backgrounds.css">
</head>

<body class="atelier-page atelier-preview">

<header>
    <h1>Hair Bestie ✨</h1>
</header>

<main>
    <h2>Your Beauty Preview ✨</h2>
    <p>Let's make sure you've chosen the look you love.</p>
    <p id="previewMessage" role="status" hidden></p>
    <a id="previewRecovery" hidden></a>

    <div class="preview-container">

        <div class="preview-card">
            <h3>Your Photo</h3>
            <img id="userPhoto" alt="Your uploaded photo">
        </div>

        <div class="preview-card">
            <h3>Your Selected Hairstyle</h3>
            <img id="hairPhoto" alt="Your selected hairstyle">
            <h3 id="hairName"></h3>
        </div>

    </div>

    <div class="buttons">
        <button class="back" onclick="goBack()">
            ← Choose Another Style
        </button>

        <button class="continue" onclick="continueToTryOn()">
            Continue ✨
        </button>
    </div>
</main>

<script>
    const previewContainer = document.querySelector(".preview-container");
    const previewButtons = document.querySelector(".buttons");
    const previewMessage = document.getElementById("previewMessage");
    const previewRecovery = document.getElementById("previewRecovery");
    const userPhotoElement = document.getElementById("userPhoto");
    const hairPhotoElement = document.getElementById("hairPhoto");
    const continueButton = document.querySelector(".continue");

    function showRecovery(message, destination, label, hidePreview) {
        previewMessage.textContent = message;
        previewMessage.hidden = false;
        previewRecovery.href = destination;
        previewRecovery.textContent = label;
        previewRecovery.hidden = false;
        if (hidePreview) {
            previewContainer.hidden = true;
            previewButtons.hidden = true;
        }
    }

    let userPhoto = null;
    let selectedHair = null;
    let selectedHairImage = null;
    try {
        userPhoto = sessionStorage.getItem("hairstyleUserPhoto");
        selectedHair = sessionStorage.getItem("selectedHairStyle");
        selectedHairImage = sessionStorage.getItem("selectedHairImage");
    } catch (error) {
        console.error("Could not read preview data:", error);
        showRecovery(
            "Your saved photo could not be accessed. Please upload it again to continue.",
            "photo-upload.html",
            "Go to Photo Upload",
            true
        );
    }

    if (!previewMessage.hidden) {
        // Storage access failed; the recovery route is already displayed.
    } else if (!userPhoto || !userPhoto.startsWith("data:image/")) {
        showRecovery(
            "Your photo is missing or invalid. Upload it again to continue.",
            "photo-upload.html",
            "Go to Photo Upload",
            true
        );
    } else if (!selectedHair || !selectedHairImage) {
        showRecovery(
            "Your hairstyle selection is missing. Return to the gallery and choose a style.",
            "hairstyles.html",
            "Choose a Hairstyle",
            true
        );
    } else {
        userPhotoElement.onerror = function() {
            showRecovery(
                "Your saved photo could not be displayed. Upload it again to continue.",
                "photo-upload.html",
                "Go to Photo Upload",
                true
            );
        };
        hairPhotoElement.onerror = function() {
            hairPhotoElement.hidden = true;
            continueButton.disabled = true;
            showRecovery(
                "The selected hairstyle image could not be loaded. Choose another style from the gallery.",
                "hairstyles.html",
                "Choose Another Hairstyle",
                false
            );
        };

        document.getElementById("hairName").textContent = selectedHair;
        userPhotoElement.src = userPhoto;
        hairPhotoElement.src = selectedHairImage;
    }

    function goBack() {
        window.location.href = "hairstyles.html";
    }

    function continueToTryOn() {
        alert("Your selection is ready! The realistic hairstyle try-on feature is our next development stage.");
    }
</script>

</body>
</html>
