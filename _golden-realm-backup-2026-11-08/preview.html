
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Preview | Hair Bestie</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #25152E, #492B49);
            color: #FFF0C9;
            min-height: 100vh;
        }

        header {
            padding: 22px;
            text-align: center;
            border-bottom: 1px solid #D9AE55;
        }

        header h1 {
            color: #D9AE55;
            margin: 0;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        h2 {
            color: #D9AE55;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .preview-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid #D9AE55;
            border-radius: 18px;
            padding: 18px;
        }

        .preview-card img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #1B1020;
            border-radius: 12px;
        }

        .preview-card h3 {
            color: #D9AE55;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 14px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .back {
            background: transparent;
            border: 1px solid #D9AE55;
            color: #FFF0C9;
        }

        .continue {
            background: #D9AE55;
            color: #25152E;
        }

        @media (max-width: 650px) {
            .preview-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/css/atelier-backgrounds.css">
</head>

<body class="atelier-page atelier-preview">

<header>
    <h1>Hair Bestie ✨</h1>
</header>

<main>
    <h2>Your Beauty Preview ✨</h2>
    <p>Let's make sure you've chosen the look you love.</p>

    <div class="preview-container">

        <div class="preview-card">
            <h3>Your Photo</h3>
            <img id="userPhoto" alt="Your uploaded photo">
        </div>

        <div class="preview-card">
            <h3>Your Selected Hairstyle</h3>
            <img id="hairPhoto" alt="Your selected hairstyle">
            <h3 id="hairName"></h3>
        </div>

    </div>

    <div class="buttons">
        <button class="back" onclick="goBack()">
            ← Choose Another Style
        </button>

        <button class="continue" onclick="continueToTryOn()">
            Continue ✨
        </button>
    </div>
</main>

<script>
    const userPhoto = sessionStorage.getItem("hairstyleUserPhoto");
    const selectedHair = sessionStorage.getItem("selectedHairStyle");
    const selectedHairImage = sessionStorage.getItem("selectedHairImage");

    if (!userPhoto || !selectedHair || !selectedHairImage) {
        alert("Your photo or hairstyle selection is missing. Please select them again.");
        window.location.href = "hairstyles.html";
    } else {
        document.getElementById("userPhoto").src = userPhoto;
        document.getElementById("hairPhoto").src = selectedHairImage;
        document.getElementById("hairName").textContent = selectedHair;
    }

    function goBack() {
        window.location.href = "hairstyles.html";
    }

    function continueToTryOn() {
        alert("Your selection is ready! The realistic hairstyle try-on feature is our next development stage.");
    }
</script>

</body>
</html>
